<text x="390" y="418" font-size="13" fill="#f5c451" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">recuperar .bak</text>
<text x="390" y="444" font-size="12" fill="#9aa1ab">y seguir con la copia anterior</text>
