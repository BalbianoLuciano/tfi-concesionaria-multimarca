<text x="680" y="338" font-size="12.5" fill="#9aa1ab">esquema: un .jar nuevo lee</text>
<text x="680" y="358" font-size="12.5" fill="#9aa1ab">datos viejos</text>
<text x="680" y="378" font-size="12.5" fill="#9aa1ab"></text>
