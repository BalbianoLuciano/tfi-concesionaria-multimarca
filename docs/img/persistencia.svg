<text x="394" y="99" font-size="14" fill="#e6e8eb" font-weight="600">respaldar</text>
<text x="364" y="128" font-size="13" fill="#5ac8fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">datos.ser → .bak</text>
<text x="364" y="148" font-size="12" fill="#9aa1ab">copia del anterior</text>
