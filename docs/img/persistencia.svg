<text x="664" y="128" font-size="13" fill="#5ac8fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ATOMIC_MOVE</text>
<text x="664" y="148" font-size="12" fill="#9aa1ab">tmp → datos.ser de una</text>
<text x="480" y="186" font-size="12.5" fill="#9aa1ab" text-anchor="middle" font-style="italic">si se corta la luz en el medio, en disco queda el archivo viejo o el nuevo: nunca uno a medias</text>
<line x1="40" y1="210" x2="920" y2="210" stroke="#353b44"/>
